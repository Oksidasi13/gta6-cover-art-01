<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover — GTA 6-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover</h1>
    <p>Your photos and a caption, made into a Vice City cover. Photos stay on your machine.</p>
    <fieldset>
      <legend>Photos — one per panel</legend>
      <label>Hero photo <input data-panel="0" type="file" accept="image/*"></label>
      <label>Second panel <input data-panel="1" type="file" accept="image/*"></label>
      <label>Third panel <input data-panel="2" type="file" accept="image/*"></label>
      <button id="fill-all" type="button">Fill all panels with the hero photo</button>
    </fieldset>
    <fieldset>
      <legend>Crop the selected panel — <span id="panel-name">Hero</span></legend>
      <p class="hint">Click a panel in the preview to select it, then drag it to pan or scroll to zoom.</p>
      <label class="zoom-row">Zoom <span id="zoom-label">1.00×</span>
        <input id="zoom" type="range" min="1" max="3" step="0.05" value="1">
      </label>
      <button id="reset-crop" type="button">Reset crop</button>
    </fieldset>
    <fieldset>
      <legend>Caption</legend>
      <div class="row">
        <label>Title <input id="title" type="text" maxlength="40" value="Sunset Heist"></label>
        <label>Subtitle <input id="subtitle" type="text" maxlength="60" value="Vice City • 2026"></label>
      </div>
    </fieldset>
    <label>Post size
      <select id="size">
        <option value="1920x1080" selected>1920 × 1080 — landscape</option>
        <option value="1080x1080">1080 × 1080 — square</option>
        <option value="1080x1350">1080 × 1350 — portrait</option>
      </select>
    </label>
    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1920" height="1080" aria-label="The cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
